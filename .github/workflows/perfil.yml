name: Vista previa del perfil

on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Construir la imagen
        run: docker build -q -t perfil ./puerto

      - name: Generar la biblioteca
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: docker run --rm -v "$PWD:/repo" -e GITHUB_TOKEN --entrypoint python perfil perfil/perfil.py

      - name: Preparar el parche
        run: |
          git add -- README.md perfil/salida
          git diff --cached --binary > revision.patch

      - uses: actions/upload-artifact@v4
        with:
          name: perfil-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            README.md
            perfil/salida
            revision.patch
          retention-days: 30
