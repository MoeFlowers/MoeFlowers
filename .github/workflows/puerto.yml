name: Puerto Docker

# Cada issue que empieza por "docker run" carga un contenedor con el usuario de quien lo abrió
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  packages: read

# Un contenedor a la vez: evita que dos cargas pisen la misma imagen
concurrency:
  group: puerto
  cancel-in-progress: false

jobs:
  cargar:
    if: startsWith(github.event.issue.title, 'docker run')
    runs-on: ubuntu-latest
    env:
      IMAGEN: ghcr.io/moeflowers/puerto:latest
    steps:
      - name: Avisar que la carga empezó
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/issues/${{ github.event.issue.number }}/reactions" -f content=eyes --silent

      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Traer la imagen del puerto
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$IMAGEN" || docker build -t "$IMAGEN" ./puerto

      - name: Cargar el contenedor
        env:
          USUARIO: ${{ github.event.issue.user.login }}
        run: docker run --rm -v "$PWD:/repo" -e USUARIO "$IMAGEN" cargar

      - name: Guardar el barco
        run: |
          git config user.name "MoeFlowers"
          git config user.email "143764282+MoeFlowers@users.noreply.github.com"
          git add -A puerto README.md
          git reset -q puerto/respuesta.md
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Puerto: contenedor de @${{ github.event.issue.user.login }}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Responder y cerrar el issue
        env:
          GH_TOKEN: ${{ github.token }}
          NUMERO: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$NUMERO" --repo "$GITHUB_REPOSITORY" --body-file puerto/respuesta.md
          gh issue close "$NUMERO" --repo "$GITHUB_REPOSITORY"
