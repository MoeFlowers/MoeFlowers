name: Puerto Docker

on:
  issues:
    types: [opened]

permissions:
  contents: read
  packages: read

jobs:
  cargar:
    if: startsWith(github.event.issue.title, 'docker run')
    runs-on: ubuntu-latest
    env:
      IMAGEN: ghcr.io/moeflowers/puerto:latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Traer la imagen del puerto
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$IMAGEN" || docker build -t "$IMAGEN" ./puerto

      - name: Preparar el contenedor
        env:
          USUARIO: ${{ github.event.issue.user.login }}
        run: docker run --rm -v "$PWD:/repo" -e USUARIO "$IMAGEN" cargar

      - name: Preparar el parche
        run: |
          git add -- README.md puerto/contenedores.json puerto/salida
          git diff --cached --binary > revision.patch

      - uses: actions/upload-artifact@v4
        with:
          name: puerto-issue-${{ github.event.issue.number }}-intento-${{ github.run_attempt }}
          path: |
            README.md
            puerto/contenedores.json
            puerto/respuesta.md
            puerto/salida
            revision.patch
          retention-days: 30
